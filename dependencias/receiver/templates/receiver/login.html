{% extends 'receiver/base.html' %}{% block content %}<section class="panel" style="max-width:460px;margin:60px auto">
    <span class="badge">Acceso de revisores</span>
    <h1>Revisa las solicitudes</h1>
    <p class="muted">Las resoluciones emitidas aquí son simuladas.</p>{% if error %}<p class="error" role="alert">{{
        error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="username">Usuario</label><input
            id="username" name="username" autocomplete="username" required maxlength="150"><label
            for="password">Contraseña</label><input id="password" name="password" type="password"
            autocomplete="current-password" required><button>Entrar al portal</button></form>
</section>{% endblock %}
